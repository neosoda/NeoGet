# Cargo build artifacts are kept in a dedicated directory at the repository root
# (git-ignored) so that the Vite dev server never watches the Rust build tree:
# on Windows the Rust linker locks the .exe it writes, which makes the watcher
# fail with EBUSY.
#
# The path is deliberately relative: an absolute path would only work on the
# machine that wrote it and would break every other checkout and CI runner.
# The Vite watcher excludes this directory explicitly (see vite.config.ts).
[build]
target-dir = "target/neoget"
